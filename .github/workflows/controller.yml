name: Azkar Controller

on:
  workflow_dispatch: {}

concurrency:
  group: azkar-repo-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python controller.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}

      - name: Commit changes
        run: |
          git config user.name "azkar-controller"
          git config user.email "actions@github.com"
          git add azkar.json state.json controller_state.json
          git diff --staged --quiet || git commit -m "controller update"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 3
          done